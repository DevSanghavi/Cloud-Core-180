name: Continuous Deployment with Automated Rollback

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # PHASE 1: Deploy Version 1 (Good Release)
      - name: Phase 1 - Deploy v1 (nginx:1.25)
        run: |
          echo "=== Deploying v1 (Good Release) ==="
          export IMAGE="nginx"
          export IMAGE_TAG="1.25"
          
          # Create docker-compose dynamically
          cat > compose.yaml << 'INNER'
          services:
            web:
              image: ${IMAGE}:${IMAGE_TAG}
              ports:
                - "8080:80"
              restart: unless-stopped
          INNER
          
          docker compose up -d
          sleep 3
          
          # Verify health
          curl -fsS http://localhost:8080 >/dev/null && echo "v1 deployed successfully!"
          
          # Store last known-good tag
          echo "1.25" > deployed-tag.txt

      # PHASE 2: Attempt Version 2 (Bad Release)
      - name: Phase 2 - Deploy v2 (nginx:missing-release)
        id: deploy_v2
        continue-on-error: true
        run: |
          echo "=== Attempting v2 (Bad Release) ==="
          export IMAGE="nginx"
          export IMAGE_TAG="missing-release"
          
          # This command will fail because the image tag does not exist
          docker compose up -d

      # PHASE 3: Automated Rollback to Last Known-Good Version
      - name: Phase 3 - Execute Rollback to v1
        if: steps.deploy_v2.outcome == 'failure' || steps.deploy_v2.outcome == 'success'
        run: |
          echo "=== Failure Detected in v2! Initiating Rollback... ==="
          
          # Retrieve last known-good tag from record
          ROLLBACK_TAG=$(cat deployed-tag.txt)
          echo "Rolling back to tag: $ROLLBACK_TAG"
          
          export IMAGE="nginx"
          export IMAGE_TAG="$ROLLBACK_TAG"
          
          # Re-deploy known-good version
          docker compose up -d
          sleep 3
          
          # Health check to confirm recovery
          curl -fsS http://localhost:8080 >/dev/null && echo "Rollback successful! System restored to $ROLLBACK_TAG."
          docker compose ps
