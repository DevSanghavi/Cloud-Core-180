name: Use Secrets AWS SSH
on:
  push:
    branches: [main]
    paths: ['days-93-github-actions-secrets/**']
  pull_request:
    branches: [main]
    paths: ['days-93-github-actions-secrets/**']
jobs:
  aws-and-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS CLI from secrets
        run: |
          aws configure set aws_access_key_id ${{ secrets.DAY93_AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.DAY93_AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1
          aws sts get-caller-identity --query Account --output text
      - name: Write SSH key and test ssh-add
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DAY93_SSH_PRIVATE_KEY }}" > ~/.ssh/day93_ci_key
          chmod 600 ~/.ssh/day93_ci_key
          ssh-add ~/.ssh/day93_ci_key
          ssh-add -l | grep day93-ci@cloudmentor || echo "key-fingerprint-present"
