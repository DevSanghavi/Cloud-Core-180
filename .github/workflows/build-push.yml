name: Build and Push to GHCR

on:
  push:
    branches: [main]
    paths: ['days-97-github-actions-docker-compose-deploy/app/**']

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./days-97-github-actions-docker-compose-deploy/app
          push: true
          tags: |
            ghcr.io/devsanghavi/cloud-core-180/day97-app:latest
            ghcr.io/devsanghavi/cloud-core-180/day97-app:${{ github.sha }}
