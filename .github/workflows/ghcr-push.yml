name: GHCR Push
on:
  push:
    branches: [main]
    paths: ['days-94-github-actions-ghcr-push/**']
  pull_request:
    branches: [main]
    paths: ['days-94-github-actions-ghcr-push/**']
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        
      - name: Build Docker image
        run: docker build -t day94-ghcr-demo:build -f days-94-github-actions-ghcr-push/Dockerfile days-94-github-actions-ghcr-push/
        
      - name: Tag with owner/repo and SHA
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short=7 "$GITHUB_SHA")
          docker tag day94-ghcr-demo:build ghcr.io/$OWNER/$REPO:$SHA
          echo "IMAGE_OWNER=$OWNER" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=$REPO" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$SHA" >> "$GITHUB_ENV"
          
      - name: Push to GHCR
        run: docker push ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
