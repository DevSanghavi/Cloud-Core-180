name: Day 92 GitHub Actions Docker Build SHA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Practice 3: Pre-requisite code validation job
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial: Tells the runner to jump into your exact folder first
        working-directory: days-92-github-actions-docker-build-sha
    steps:
      - name: Checkout repository source files
        uses: actions/checkout@v4

      - name: Validate JavaScript Syntax
        run: node --check index.js

  # Main packaging and compilation pipeline job
  build:
    needs: [lint] # Build depends explicitly on lint success
    runs-on: ubuntu-latest
    defaults:
      run:
        # Crucial: Tells the runner to jump into your exact folder first
        working-directory: days-92-github-actions-docker-build-sha
    strategy:
      matrix:
        node-version: [18, 20] # Practice 4: Multi-environment matrix strategy
    
    steps:
      - name: Checkout repository source files
        uses: actions/checkout@v4

      # Practice 5: Upload clean source code files as an isolated artifact
      - name: Archive production source code files
        uses: actions/upload-artifact@v4
        with:
          name: source-code-node-${{ matrix.node-version }}
          path: |
            days-92-github-actions-docker-build-sha/Dockerfile
            days-92-github-actions-docker-build-sha/index.js
            days-92-github-actions-docker-build-sha/VERSION
          retention-days: 1

      # Practice 2: Parse configuration values and compile Docker image
      - name: Compile and Tag Image with Version and Git SHA
        run: |
          APP_VERSION=$(cat VERSION)
          GIT_SHA=$(git rev-parse --short=7 "$GITHUB_SHA")
          COMBINED_TAG="$APP_VERSION-$GIT_SHA"
          
          echo "Building image version $COMBINED_TAG on Node base version ${{ matrix.node-version }}..."
          
          docker build \
            --build-arg NODE_VERSION=${{ matrix.node-version }} \
            --build-arg VERSION=$APP_VERSION \
            -t day-92-docker-build-sha:${{ matrix.node-version }}-$COMBINED_TAG .
          
          echo "FINAL_IMAGE_TAG=${{ matrix.node-version }}-$COMBINED_TAG" >> "$GITHUB_ENV"

      - name: Export Image Artifact into Portable Tarball Archive
        run: |
          docker save day-92-docker-build-sha:${{ env.FINAL_IMAGE_TAG }} -o archive-${{ env.FINAL_IMAGE_TAG }}.tar

      - name: Upload Tarball Archive to GitHub Workflow Storage Area
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar-node-${{ matrix.node-version }}
          path: days-92-github-actions-docker-build-sha/archive-*.tar
          retention-days: 1
