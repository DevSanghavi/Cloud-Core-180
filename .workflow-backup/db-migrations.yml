name: Database Migrations

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Flyway Migrations
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/days-98-db-migrations/db/migration:/flyway/sql \
            -e FLYWAY_URL="jdbc:postgresql://${{ secrets.DB_HOST }}:5432/postgres" \
            -e FLYWAY_USER="postgres" \
            -e FLYWAY_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e FLYWAY_SCHEMAS="public" \
            flyway/flyway migrate
